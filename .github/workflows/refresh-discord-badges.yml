name: Refresh Discord Badges

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-discord-badges
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate Discord pill SVGs from snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate badges from on-disk snapshot
        run: npx tsx scripts/generate-badges.ts --from-snapshot

      - name: Open PR if any badge changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(badges): nightly snapshot refresh"
          title: "chore(badges): nightly snapshot refresh"
          body: |
            Automated refresh of `docs/badges/svg/*.svg` from
            `docs/internal-info/ROLES.md` + `CHANNELS.md`.

            Auto-generated by `.github/workflows/refresh-discord-badges.yml`.
            No diff means everything is already in sync.
          branch: bot/discord-badges-refresh
          delete-branch: true
          add-paths: |
            docs/badges/svg
            docs/badges/manifest.json

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_CI_WEBHOOK not configured; skipping notification"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Workflow failed: refresh-discord-badges (run ${{ github.run_id }}) - https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
