name: Refresh Discord Badges

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: refresh-discord-badges
  cancel-in-progress: true

jobs:
  refresh:
    name: Regenerate Discord pill SVGs from snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Regenerate badges from on-disk snapshot
        run: npx tsx scripts/generate-badges.ts --from-snapshot

      - name: Commit any badge that actually changed
        # This used to open a PR, which the repo blocks for Actions, so the job failed
        # every night. It failed on a diff that was never real: the manifest carried two
        # timestamps that moved on every run. Those are stable now, so a clean snapshot
        # leaves nothing to commit and this step is a no-op.
        #
        # `git add -A` is safe here: the checkout is fresh and the generator is the only
        # thing that has run, so every change in the tree is its output. It also catches
        # the markdown URL rewrites that updateDocUrls() makes, which the old add-paths
        # list silently discarded.
        run: |
          if git diff --quiet; then
            echo "Badges already in sync; nothing to commit."
            exit 0
          fi
          git config user.name "watchthelight"
          git config user.email "admin@watchthelight.org"
          git add -A
          git commit -m "chore(badges): nightly snapshot refresh"
          git push

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_CI_WEBHOOK not configured; skipping notification"
            exit 0
          fi
          curl -sS -X POST "$WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Workflow failed: refresh-discord-badges (run ${{ github.run_id }}) - https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
