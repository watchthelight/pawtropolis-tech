name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        # HARD GATE — promoted 2026-05-02 after fixing src/commands/cleanup.ts
        # See docs/operations/ci-policy.md for the gate hierarchy.
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true  # SOFT — large web/ + workers/ globals backlog tracked in TODO.md
      - name: Format Check
        run: npm run format:check
        continue-on-error: true  # SOFT — large web/ Prettier drift tracked in TODO.md

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # Dummy values for test environment validation
      DISCORD_TOKEN: test_token_for_ci
      CLIENT_ID: 123456789012345678
      RESET_PASSWORD: test_password
      DB_PATH: ./data/data.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Prepare test database
        # Tests assume ./data/data.db has the production schema. Apply
        # tests/fixtures/schema.sql (a dump of the live schema) directly.
        # No migrations — the fixture already includes every applied migration.
        # Regenerate the fixture if schema changes: see scripts/init-test-db.ts.
        run: |
          mkdir -p data
          npx tsx scripts/init-test-db.ts
      - name: Install web deps + sync SvelteKit
        # tests/web/*.test.ts depends on web/tsconfig.json extending
        # web/.svelte-kit/tsconfig.json which is generated by svelte-kit sync.
        # web/ is a separate package, needs its own install before sync.
        run: |
          cd web
          npm ci
          npx svelte-kit sync
      - name: Run tests
        # HARD GATE — promoted 2026-05-04 after fixing the two pre-existing
        # failures (artistRotation handlers + roles rename). See
        # docs/operations/ci-policy.md for the gate hierarchy.
        run: npm run test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Smoke test: verify the built artifact has no syntax errors and all
      # transitive imports resolve. node --check parses but does not execute,
      # so it does not need Discord credentials or a real DB.
      - name: Smoke check built artifact
        run: node --check dist/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
