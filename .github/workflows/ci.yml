name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        # HARD GATE — promoted 2026-05-02 after fixing src/commands/cleanup.ts
        # See docs/operations/ci-policy.md for the gate hierarchy.
        run: npm run typecheck
      - name: Lint
        # HARD GATE: 0 errors (warnings allowed). See docs/operations/ci-policy.md.
        run: npm run lint
      - name: Format Check
        run: npm run format:check
        # SOFT: flips to a hard gate right after the one-shot mechanical format commit.
        continue-on-error: true
      - name: Dead code (knip)
        # HARD GATE: knip exits 0 (#00271).
        run: npm run knip

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Node 24 is the primary target. Node 20 is end of life but stays as a
        # second leg because the production host's Node version is unconfirmed.
        node: ["24", "20"]
    env:
      # Dummy values for test environment validation
      DISCORD_TOKEN: test_token_for_ci
      CLIENT_ID: "123456789012345678"
      RESET_PASSWORD: test_password
      DB_PATH: ./data/data.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - run: npm ci
      - name: Prepare test database
        # Tests assume ./data/data.db has the production schema. Apply
        # tests/fixtures/schema.sql (a dump of the live schema) directly.
        # No migrations — the fixture already includes every applied migration.
        # Regenerate the fixture if schema changes: see scripts/init-test-db.ts.
        run: |
          mkdir -p data
          npx tsx scripts/init-test-db.ts
      - name: Install web deps + sync SvelteKit
        # tests/web/*.test.ts depends on web/tsconfig.json extending
        # web/.svelte-kit/tsconfig.json which is generated by svelte-kit sync.
        # web/ is a separate package, needs its own install before sync.
        run: |
          cd web
          npm ci
          npx svelte-kit sync
      - name: Run tests
        # HARD GATE — promoted 2026-05-04 after fixing the two pre-existing
        # failures (artistRotation handlers + roles rename). See
        # docs/operations/ci-policy.md for the gate hierarchy.
        run: npm run test -- --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-node${{ matrix.node }}
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      # Smoke test: verify the built artifact has no syntax errors and all
      # transitive imports resolve. node --check parses but does not execute,
      # so it does not need Discord credentials or a real DB.
      - name: Smoke check built artifact
        run: node --check dist/index.js
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  web:
    name: Dashboard (check & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx svelte-kit sync
      - name: Type check (svelte-check)
        # 0 errors, 86 warnings when added. Warnings do not fail svelte-check.
        run: npm run check
      - name: Build
        run: npm run build
