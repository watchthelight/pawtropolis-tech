name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Typecheck
        # HARD GATE — promoted 2026-05-02 after fixing src/commands/cleanup.ts
        # See docs/operations/ci-policy.md for the gate hierarchy.
        run: npm run typecheck
      - name: Lint
        run: npm run lint
        continue-on-error: true  # SOFT — large web/ + workers/ globals backlog tracked in TODO.md
      - name: Format Check
        run: npm run format:check
        continue-on-error: true  # SOFT — large web/ Prettier drift tracked in TODO.md

  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      # Dummy values for test environment validation
      DISCORD_TOKEN: test_token_for_ci
      CLIENT_ID: 123456789012345678
      RESET_PASSWORD: test_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Run tests
        run: npm run test -- --coverage
        # SOFT — two pre-existing suite failures tracked in docs/operations/ci-policy.md:
        #   1. tests/features/artistRotation/handlers.test.ts (module-level prepares
        #      against tables not present in fresh DB — partial fix in counters.ts)
        #   2. tests/lib/roles.test.ts (assertion expects "Server Owner" but the
        #      role was renamed to "Community Founder")
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
