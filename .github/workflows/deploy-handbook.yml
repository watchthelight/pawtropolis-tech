name: Deploy handbook (web) to EC2

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'web/**'
  workflow_dispatch: {}

concurrency:
  # Coalesce rapid pushes so a long-running deploy can't be doubled-up.
  group: deploy-handbook
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A push starts this workflow and CI at the same moment. The deploy waits for
  # the CI run of the same commit and goes ahead only if that run passed.
  # A run started by hand skips the wait: that is the way to deploy when CI is
  # red for a reason that has nothing to do with the dashboard.
  ci-gate:
    name: Wait for CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Wait for the CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --event push \
              --json databaseId,status,conclusion \
              --jq 'sort_by(.databaseId) | last | select(. != null) | "\(.databaseId) \(.status) \(.conclusion)"')
            if [ -z "$run" ]; then
              echo "attempt $attempt: no CI run for $SHA yet"
            else
              read -r id status conclusion <<<"$run"
              echo "attempt $attempt: CI run $id is $status $conclusion"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "CI did not pass on $SHA, so nothing is deployed."
                echo "Fix CI and push again, or start this workflow by hand."
                exit 1
              fi
            fi
            sleep 20
          done
          echo "CI did not finish within 30 minutes, so nothing is deployed."
          exit 1

  deploy:
    needs: ci-gate
    # ci-gate is skipped for a run started by hand, and a skipped job would
    # skip this one too without the explicit condition.
    if: ${{ !cancelled() && (needs.ci-gate.result == 'success' || needs.ci-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Package build artefacts
        run: |
          set -euo pipefail
          tar -czf web-deploy.tar.gz \
            -C web build package.json package-lock.json static svelte.config.js
          ls -lh web-deploy.tar.gz

      - name: Add EC2 to known_hosts
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2

      - name: SCP artefact to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=accept-new \
            web-deploy.tar.gz "$EC2_USER@$EC2_HOST:/home/ubuntu/pawtropolis-tech/"

      # The artefact carries package-lock.json, so the build can need packages
      # the host has not installed yet. npm ci runs when node_modules was not
      # installed from the lockfile just extracted; deploy.sh keeps the same
      # marker. The braces make bash read the whole script before it runs any
      # of it, so a command that reads stdin cannot swallow the rest.
      # pm2 prints its whole process table after a restart, and this log is
      # public: the restart is silenced and only the dashboard's row is shown.
      - name: Extract, install and restart on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/id_ec2 -o StrictHostKeyChecking=accept-new \
            "$EC2_USER@$EC2_HOST" 'bash -ls' <<'REMOTE'
          {
            set -euo pipefail
            cd /home/ubuntu/pawtropolis-tech/web
            tar -xzf ../web-deploy.tar.gz
            lock_hash=$(sha256sum package-lock.json | cut -d' ' -f1)
            if [ "$lock_hash" != "$(cat node_modules/.lock-sha256 2>/dev/null)" ]; then
              npm ci --omit=dev
              echo "$lock_hash" > node_modules/.lock-sha256
            fi
            pm2 restart pawtropolis-web > /dev/null
            rm -f ../web-deploy.tar.gz
            pm2 list | grep pawtropolis-web
          }
          REMOTE

      - name: Smoke test
        env:
          ORIGIN: https://pawtropolis.tech
        run: |
          set -euo pipefail
          sleep 4
          code=$(curl -s -o /dev/null -w '%{http_code}' "$ORIGIN/handbook/bot-handbook")
          echo "GET /handbook/bot-handbook -> $code"
          test "$code" = "200"
