# Litestream configuration for Pawtropolis Tech
#
# Continuously replicates the SQLite database to Cloudflare R2 so the bot
# survives a single-EC2 disaster (instance loss, disk corruption, fat-finger
# `rm`, bad migration). The bot itself is unchanged — Litestream runs as a
# separate systemd unit on bash-ec2 and tails the SQLite WAL.
#
# This file is a TEMPLATE. Copy to /etc/litestream.yml on the production
# EC2 box during Phase 1.2 deployment, then either:
#   1. Inject the env vars via the systemd unit (preferred — no secrets in
#      this file ever land on disk in plaintext), OR
#   2. Hardcode the credentials below (faster, slightly less safe).
#
# Credentials live in CREDENTIALS.md (gitignored) under "Cloudflare → R2".
# Account-scoped R2 token, scoped read+write to bucket pawtropolis-litestream
# only. Even if leaked, the blast radius is limited to that one bucket.
#
# Plan reference: Phase 1.1 of ~/.claude/plans/logical-squishing-dragon.md

dbs:
  - path: /home/ubuntu/pawtropolis-tech/data/data.db
    replicas:
      - type: s3
        bucket: pawtropolis-litestream
        path: data.db
        endpoint: https://${LITESTREAM_R2_ACCOUNT_ID}.r2.cloudflarestorage.com
        access-key-id: ${LITESTREAM_ACCESS_KEY_ID}
        secret-access-key: ${LITESTREAM_SECRET_ACCESS_KEY}
        # R2 ignores region but Litestream's S3 client requires the field set
        region: auto

        # ----------------------------------------------------------------------
        # Sync interval: how often Litestream uploads new WAL frames to R2.
        # Default is 1s, which burns ~2.6M Class A R2 ops per month — over the
        # 1M free-tier limit. We bump to 10s which gives us ~260k ops/mo and
        # keeps R2 firmly free. RPO worst case: 10 seconds of writes lost.
        # ----------------------------------------------------------------------
        sync-interval: 10s

        # ----------------------------------------------------------------------
        # Snapshot interval: full DB snapshot to R2 on top of streaming WAL.
        # Daily snapshots make point-in-time restores fast (no need to replay
        # weeks of WAL frames).
        # ----------------------------------------------------------------------
        snapshot-interval: 24h

        # ----------------------------------------------------------------------
        # Retention: how long to keep old snapshots and WAL segments in R2.
        # 30 days is plenty for our use case and keeps us well under the 10 GB
        # R2 free tier (the bot DB is <1 GB).
        # ----------------------------------------------------------------------
        retention: 720h

        # ----------------------------------------------------------------------
        # Validation: re-checks the integrity of retained snapshots once a day.
        # Catches silent corruption in the R2 backups before we need them.
        # ----------------------------------------------------------------------
        validation-interval: 24h

# ----------------------------------------------------------------------------
# Operational notes (Phase 1.2 + 1.3 will wire these up):
#
#   Install on EC2:
#     wget https://github.com/benbjohnson/litestream/releases/download/v0.3.13/litestream-v0.3.13-linux-amd64.deb
#     sudo dpkg -i litestream-v0.3.13-linux-amd64.deb
#     sudo cp scripts/litestream.example.yml /etc/litestream.yml
#     sudo cp scripts/litestream.service.example /etc/systemd/system/litestream.service
#     sudo systemctl daemon-reload
#     sudo systemctl enable --now litestream
#     sudo journalctl -fu litestream  # tail logs
#
#   Restore from R2 (see scripts/litestream-restore.sh in Phase 1.3):
#     litestream restore -o /tmp/restored.db s3://pawtropolis-litestream/data.db
#
#   Verify the snapshot chain:
#     litestream snapshots /home/ubuntu/pawtropolis-tech/data/data.db
#
# ----------------------------------------------------------------------------
