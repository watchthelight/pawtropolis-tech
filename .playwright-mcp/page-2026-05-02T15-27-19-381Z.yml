                  - separator [ref=e1040]
                  - generic [ref=e1041]:
                    - heading "Reviewing Applications" [level=2] [ref=e1042]
                    - 'link "Permalink: Reviewing Applications" [ref=e1043] [cursor=pointer]':
                      - /url: "#reviewing-applications"
                      - img [ref=e1044]
                  - paragraph [ref=e1046]:
                    - text: When a new application comes in, click the
                    - strong [ref=e1047]: Claim
                    - text: button first so other mods know you're handling it. Then use the
                    - strong [ref=e1048]: Accept
                    - text: ","
                    - strong [ref=e1049]: Reject
                    - text: ", or"
                    - strong [ref=e1050]: Kick
                    - text: buttons to take action.
                  - paragraph [ref=e1051]: "If an application is bugged and you can't use the buttons, use these commands instead:"
                  - list [ref=e1052]:
                    - listitem [ref=e1053]:
                      - code [ref=e1054]: /accept
                      - text: ": approve the application"
                    - listitem [ref=e1055]:
                      - code [ref=e1056]: /reject reason:Your reason here
                      - text: ": reject with explanation"
                    - listitem [ref=e1057]:
                      - code [ref=e1058]: /kick reason:Your reason here
                      - text: ": kick from server"
                    - listitem [ref=e1059]:
                      - code [ref=e1060]: /unclaim
                      - text: ": release so someone else can review it"
                  - paragraph [ref=e1061]: "Each command accepts one of these to identify the application:"
                  - list [ref=e1062]:
                    - listitem [ref=e1063]:
                      - code [ref=e1064]: app:A1B2C3
                      - text: ": the short code shown on the embed"
                    - listitem [ref=e1065]:
                      - code [ref=e1066]: user:@Username
                      - text: ": mention or pick from the list"
                    - listitem [ref=e1067]:
                      - code [ref=e1068]: uid:123456789
                      - text: ": their Discord ID if they already left"
                  - paragraph [ref=e1069]:
                    - text: For rejections, add
                    - code [ref=e1070]: perm:true
                    - text: if they should never be allowed to re-apply.
                  - paragraph [ref=e1071]:
                    - text: To see what's waiting for review, run
                    - code [ref=e1072]: /listopen
                    - text: . Use
                    - code [ref=e1073]: scope:all
                    - text: to see everything or
                    - code [ref=e1074]: scope:drafts
                    - text: for incomplete applications.
                  - paragraph [ref=e1075]:
                    - text: Need to look up someone's history?
                    - code [ref=e1076]: /search user:@Username
                    - text: pulls up all their past applications and decisions.
                  - paragraph [ref=e1077]:
                    - text: Made a mistake with a permanent rejection?
                    - code [ref=e1078]: /unblock target:@Username
                    - text: lets them apply again.
                  - generic [ref=e1079]:
                    - heading "Checking Your Stats" [level=2] [ref=e1080]
                    - 'link "Permalink: Checking Your Stats" [ref=e1081] [cursor=pointer]':
                      - /url: "#checking-your-stats"
                      - img [ref=e1082]
                  - paragraph [ref=e1084]:
                    - text: Run
                    - code [ref=e1085]: /stats user moderator:@YourName
                    - text: to see your approval rate, response times, and activity breakdown. You can adjust the time range with
                    - code [ref=e1086]: days:30
                    - text: or whatever period you want.
                  - paragraph [ref=e1087]:
                    - code [ref=e1088]: /stats leaderboard
                    - text: shows rankings by review count, so you can see who's been most active.
                  - paragraph [ref=e1089]:
                    - text: For server-wide numbers,
                    - code [ref=e1090]: /stats approval-rate
                    - text: shows the overall approve vs reject breakdown.
                  - generic [ref=e1091]:
                    - heading "Server Activity" [level=2] [ref=e1092]
                    - 'link "Permalink: Server Activity" [ref=e1093] [cursor=pointer]':
                      - /url: "#server-activity"
                      - img [ref=e1094]
                  - paragraph [ref=e1096]:
                    - code [ref=e1097]: /stats activity
                    - text: shows a heatmap of message activity by day and hour. You can look back up to 8 weeks with
                    - code [ref=e1098]: weeks:8
                    - text: .
                  - paragraph [ref=e1099]:
                    - code [ref=e1100]: /health
                    - text: shows bot uptime and response latency.
                  - generic [ref=e1101]:
                    - heading "Events (Movie & Game Night)" [level=2] [ref=e1102]
                    - 'link "Permalink: Events (Movie & Game Night)" [ref=e1103] [cursor=pointer]':
                      - /url: "#events-movie--game-night"
                      - img [ref=e1104]
                  - paragraph [ref=e1106]:
                    - strong [ref=e1107]: "Movie Night:"
                    - text: Use
                    - code [ref=e1108]: /movie start channel:#movie-vc
                    - text: to begin tracking. When done,
                    - code [ref=e1109]: /movie end
                    - text: finalizes attendance and assigns tier roles to anyone who stayed 30+ minutes.
                  - paragraph [ref=e1110]:
                    - strong [ref=e1111]: "Game Night:"
                    - text: Use
                    - code [ref=e1112]: /event game start channel:#game-vc
                    - text: to begin tracking. When done,
                    - code [ref=e1113]: /event game end
                    - text: calculates qualification based on percentage of event attended (default 50%).
                  - paragraph [ref=e1114]:
                    - text: Check attendance with
                    - code [ref=e1115]: /movie attendance
                    - text: or
                    - code [ref=e1116]: /event game attendance
                    - text: . Add
                    - code [ref=e1117]: user:@Username
                    - text: to look up someone's progress.
