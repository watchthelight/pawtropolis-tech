                      - strong [ref=e1230]: Byte
                      - text: is a personal token that applies only to your profile.
                    - listitem [ref=e1231]:
                      - strong [ref=e1232]: AllByte
                      - text: is a global token. A staff member activates it, and the multiplier applies to everyone in the server.
                  - paragraph [ref=e1233]: AllBytes only come in Epic rarity or higher.
