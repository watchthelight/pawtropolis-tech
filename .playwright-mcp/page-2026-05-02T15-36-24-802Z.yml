                  - list [ref=e1272]:
                    - listitem [ref=e1273]:
                      - text: Check your inventory with
                      - code [ref=e1274]: /inventory
                      - text: to confirm the Byte is there.
                    - listitem [ref=e1275]:
                      - text: Run
                      - code [ref=e1276]: /shop use <item>
                      - text: to consume it. This adds a role to your profile matching the Byte's level and duration.
                    - listitem [ref=e1277]:
                      - text: With the role applied, run
                      - code [ref=e1278]: /byte
                      - text: in channel
                      - code [ref=e1279]: "896070890457018384"
                      - text: to activate it.
                    - listitem [ref=e1280]:
                      - text: For AllBytes, a staff member activates it; the global XP boost is announced in the staff-managed AllByte announcement thread (link in the live
                      - code [ref=e1281]: 「🔍」server-info
                      - text: Reward System post).
                  - paragraph [ref=e1282]: Only one role of each rarity can be attached at a time. You can't stack another Byte of the same rarity until the first one is consumed, but different rarities can coexist.
