                    - listitem [ref=e1180]: A smaller currency grant
                  - blockquote [ref=e1181]:
                    - paragraph [ref=e1182]:
                      - strong [ref=e1183]: Why no exact role IDs here?
                      - text: The role IDs that previously appeared in this section no longer match the current live "weekly winner" / "runner-up" roles, and the canonical reward breakdown lives in the newsletter post inside
                      - code [ref=e1184]: 「🔍」server-info
                      - text: rather than this doc. Refer to the live thread for the current numbers.
                  - separator [ref=e1185]
                  - generic [ref=e1186]:
                    - heading "Credit System (Monthly)" [level=2] [ref=e1187]
                    - 'link "Permalink: Credit System (Monthly)" [ref=e1188] [cursor=pointer]':
                      - /url: "#credit-system-monthly"
                      - img [ref=e1189]
                  - paragraph [ref=e1191]: 1st-place weekly winners earn 1 credit per week. Credits accumulate over the four weeks of a month and reset at the start of each month. Only one reward can be redeemed per month.
