                  - paragraph [ref=e1215]: "At the end of each month the server also picks two winners from the ambassador pool: the most active text-chat user and the most active voice-chat user. Rewards rotate each month depending on which side was more active. The top slot usually includes art, a Nitro boost, a few Byte tokens, and bulk currency; the runner-up gets a smaller version of the same mix."
                  - separator [ref=e1216]
                  - generic [ref=e1217]:
                    - heading "Byte Tokens" [level=2] [ref=e1218]
                    - 'link "Permalink: Byte Tokens" [ref=e1219] [cursor=pointer]':
                      - /url: "#byte-tokens"
                      - img [ref=e1220]
                  - paragraph [ref=e1222]: A Byte is a consumable that multiplies your leveling XP for a set duration. Bytes are obtained through giveaways, events, drops, level rewards, and the shop.
                  - generic [ref=e1223]:
                    - heading "Types" [level=3] [ref=e1224]
