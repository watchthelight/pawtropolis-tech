                  - paragraph [ref=e1157]:
                    - text: The top three most active users each week get announced in a weekly newsletter post. The exact role names and reward amounts can shift over time; the in-Discord newsletter thread is the canonical source. Find it linked from the
                    - strong [ref=e1158]: City Hall
                    - text: post inside
                    - code [ref=e1159]: 「🔍」server-info
                    - text: (the message describing reward systems lists the newsletter channel).
                  - paragraph [ref=e1160]: "The current shape of the reward (subject to change in the newsletter thread):"
