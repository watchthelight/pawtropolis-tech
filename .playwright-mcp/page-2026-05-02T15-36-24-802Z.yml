                    - listitem [ref=e1170]: One monthly credit (counts toward the credit-redemption tiers below)
                  - paragraph [ref=e1171]: If the 1st-place user is on a streak, the reward pool doubles. The pool resets when the streak breaks.
                  - generic [ref=e1172]:
