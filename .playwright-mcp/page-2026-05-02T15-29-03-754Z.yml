                      - img [ref=e1101]
                  - paragraph [ref=e1103]:
                    - strong [ref=e1104]: "Movie Night:"
                    - text: Use
                    - code [ref=e1105]: /movie start channel:#movie-vc
                    - text: to begin tracking. When done,
                    - code [ref=e1106]: /movie end
                    - text: finalizes attendance and assigns tier roles to anyone who stayed 30+ minutes.
                  - paragraph [ref=e1107]:
                    - strong [ref=e1108]: "Game Night:"
                    - text: Use
                    - code [ref=e1109]: /event game start channel:#game-vc
                    - text: to begin tracking. When done,
                    - code [ref=e1110]: /event game end
                    - text: calculates qualification based on percentage of event attended (default 50%).
                  - paragraph [ref=e1111]:
                    - text: Check attendance with
                    - code [ref=e1112]: /movie attendance
                    - text: or
                    - code [ref=e1113]: /event game attendance
                    - text: . Add
                    - code [ref=e1114]: user:@Username
                    - text: to look up someone's progress.
