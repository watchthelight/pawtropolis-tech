                  - separator [ref=e1037]
                  - generic [ref=e1038]:
                    - heading "Reviewing Applications" [level=2] [ref=e1039]
                    - 'link "Permalink: Reviewing Applications" [ref=e1040] [cursor=pointer]':
                      - /url: "#reviewing-applications"
                      - img [ref=e1041]
                  - paragraph [ref=e1043]:
                    - text: When a new application comes in, click the
                    - strong [ref=e1044]: Claim
                    - text: button first so other mods know you're handling it. Then use the
                    - strong [ref=e1045]: Accept
                    - text: ","
                    - strong [ref=e1046]: Reject
                    - text: ", or"
                    - strong [ref=e1047]: Kick
                    - text: buttons to take action.
                  - paragraph [ref=e1048]: "If an application is bugged and you can't use the buttons, use these commands instead:"
                  - list [ref=e1049]:
                    - listitem [ref=e1050]:
                      - code [ref=e1051]: /accept
                      - text: ": approve the application"
                    - listitem [ref=e1052]:
                      - code [ref=e1053]: /reject reason:Your reason here
                      - text: ": reject with explanation"
                    - listitem [ref=e1054]:
                      - code [ref=e1055]: /kick reason:Your reason here
                      - text: ": kick from server"
                    - listitem [ref=e1056]:
                      - code [ref=e1057]: /unclaim
                      - text: ": release so someone else can review it"
                  - paragraph [ref=e1058]: "Each command accepts one of these to identify the application:"
                  - list [ref=e1059]:
                    - listitem [ref=e1060]:
                      - code [ref=e1061]: app:A1B2C3
                      - text: ": the short code shown on the embed"
                    - listitem [ref=e1062]:
                      - code [ref=e1063]: user:@Username
                      - text: ": mention or pick from the list"
                    - listitem [ref=e1064]:
                      - code [ref=e1065]: uid:123456789
                      - text: ": their Discord ID if they already left"
                  - paragraph [ref=e1066]:
                    - text: For rejections, add
                    - code [ref=e1067]: perm:true
                    - text: if they should never be allowed to re-apply.
                  - paragraph [ref=e1068]:
                    - text: To see what's waiting for review, run
                    - code [ref=e1069]: /listopen
                    - text: . Use
                    - code [ref=e1070]: scope:all
                    - text: to see everything or
                    - code [ref=e1071]: scope:drafts
                    - text: for incomplete applications.
                  - paragraph [ref=e1072]:
                    - text: Need to look up someone's history?
                    - code [ref=e1073]: /search user:@Username
                    - text: pulls up all their past applications and decisions.
                  - paragraph [ref=e1074]:
                    - text: Made a mistake with a permanent rejection?
                    - code [ref=e1075]: /unblock target:@Username
                    - text: lets them apply again.
                  - generic [ref=e1076]:
                    - heading "Checking Your Stats" [level=2] [ref=e1077]
                    - 'link "Permalink: Checking Your Stats" [ref=e1078] [cursor=pointer]':
                      - /url: "#checking-your-stats"
                      - img [ref=e1079]
                  - paragraph [ref=e1081]:
                    - text: Run
                    - code [ref=e1082]: /stats user moderator:@YourName
                    - text: to see your approval rate, response times, and activity breakdown. You can adjust the time range with
                    - code [ref=e1083]: days:30
                    - text: or whatever period you want.
                  - paragraph [ref=e1084]:
                    - code [ref=e1085]: /stats leaderboard
                    - text: shows rankings by review count, so you can see who's been most active.
                  - paragraph [ref=e1086]:
                    - text: For server-wide numbers,
                    - code [ref=e1087]: /stats approval-rate
                    - text: shows the overall approve vs reject breakdown.
                  - generic [ref=e1088]:
                    - heading "Server Activity" [level=2] [ref=e1089]
                    - 'link "Permalink: Server Activity" [ref=e1090] [cursor=pointer]':
                      - /url: "#server-activity"
                      - img [ref=e1091]
                  - paragraph [ref=e1093]:
                    - code [ref=e1094]: /stats activity
                    - text: shows a heatmap of message activity by day and hour. You can look back up to 8 weeks with
                    - code [ref=e1095]: weeks:8
                    - text: .
                  - paragraph [ref=e1096]:
                    - code [ref=e1097]: /health
                    - text: shows bot uptime and response latency.
                  - generic [ref=e1098]:
                    - heading "Events (Movie & Game Night)" [level=2] [ref=e1099]
