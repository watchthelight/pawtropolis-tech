                      - /url: "#github-discord-badges"
                      - img [ref=e1226]
                  - paragraph [ref=e1228]: Pawtropolis Tech renders Discord roles, channels, and users as GitHub-compatible Markdown badges. They look like Discord mention pills, use the real role color, and refresh daily from the live server.
                  - generic [ref=e1229]:
                    - heading "Why we need them" [level=2] [ref=e1230]
                    - 'link "Permalink: Why we need them" [ref=e1231] [cursor=pointer]':
                      - /url: "#why-we-need-them"
                      - img [ref=e1232]
                  - paragraph [ref=e1234]:
                    - text: GitHub Markdown does not understand Discord mention syntax. Strings like
                    - code [ref=e1235]: <@&1388676461657063505>
                    - text: ","
                    - code [ref=e1236]: <#1446602187655610461>
                    - text: ", and"
                    - code [ref=e1237]: <@123>
                    - text: show up as raw text. Worse, they leak Discord IDs and hide the actual name. The badge system replaces them with
                    - code [ref=e1238]: "![alt](https://cdn.jsdelivr.net/gh/watchthelight/pawtropolis-tech@main/docs/badges/svg/<id>.svg)"
                    - text: .
                  - generic [ref=e1239]:
                    - heading "How it works" [level=2] [ref=e1240]
                    - 'link "Permalink: How it works" [ref=e1241] [cursor=pointer]':
                      - /url: "#how-it-works"
                      - img [ref=e1242]
                  - generic [ref=e1244]:
                    - code [ref=e1246]: "Live server snapshot (docs/internal-info/ROLES.md, CHANNELS.md) -> scripts/generate-badges.ts --from-snapshot -> features/badges/snapshotResolve.ts (resolve names + colors offline) -> features/badges/renderSvg.ts (render pill SVG) -> docs/badges/svg/<id>.svg (committed to repo) -> GitHub Markdown (![alt](raw URL)) In parallel, the running bot: -> features/badges/resolve.ts (live Discord lookup) -> features/badges/liveUpdates.ts (event-driven refresh) -> data/badges/generated/<id>.svg (runtime cache) -> web/badgeEndpoint.ts (serves status.pawtropolis.tech)"
                    - button "Copy" [ref=e1248] [cursor=pointer]:
                      - img [ref=e1249]
