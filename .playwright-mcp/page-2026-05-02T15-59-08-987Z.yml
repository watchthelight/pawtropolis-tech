                  - paragraph [ref=e1140]:
                    - strong [ref=e1141]: "Note:"
                    - text: Community Staff (CS) is the broad mod-perm role (ManageMessages, MentionEveryone, ModerateMembers) attached to most staff roles. On its own it does not unlock the gatekeeping commands, which require the Gatekeeper role specifically. The role is named "Community Staff" in Discord. Older code constants and docs may refer to it as
                    - code [ref=e1142]: MOD_TEAM
                    - text: or "Moderation Team"; same role.
                  - paragraph [ref=e1143]:
                    - text: The rank-1 role is named
                    - strong [ref=e1144]: Community Founder
                    - text: in Discord. It is the role currently held by the server owner (
                    - code [ref=e1145]: wwerew0lf
                    - text: ). Older docs called this rank "Server Owner"; the live label is what permission-denied embeds and role mentions render.
