<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/paw-logo.png" type="image/png" />
		<meta name="theme-color" content="#c850c0" />
		%sveltekit.head%
		<script>try{var u=localStorage.getItem('theme-last-uid');if(u){var h=localStorage.getItem('theme-hue-'+u);if(h)document.documentElement.style.setProperty('--hue',h)}}catch(e){}</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
