<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/paw-logo.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c850c0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var m = localStorage.getItem("paw-theme");
          if (m === "observatory-dark" || m === "observatory-light" || m === "legacy") {
            el.setAttribute("data-theme", m);
          } else if (!el.getAttribute("data-theme")) {
            el.setAttribute("data-theme", "observatory-dark");
          }
          var sh = localStorage.getItem("paw-sage-h");
          if (sh) el.style.setProperty("--sage-h", sh);
          var sc = localStorage.getItem("paw-sage-c");
          if (sc) el.style.setProperty("--sage-c", sc);
          var f = localStorage.getItem("paw-font");
          var stacks = {
            figtree: '"Figtree Variable", system-ui, sans-serif',
            quicksand: '"Quicksand Variable", system-ui, sans-serif',
            hanken: '"Hanken Grotesk Variable", system-ui, sans-serif',
            fredoka: '"Fredoka Variable", system-ui, sans-serif'
          };
          if (f && stacks[f]) el.style.setProperty("--font-head", stacks[f]);
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
