<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" href="/paw-logo.png" type="image/png" />
		<meta name="theme-color" content="#c850c0" />
		<script>
			(function() {
				try {
					var s = localStorage.getItem('paw-style');
					if (s && s !== 'default') document.documentElement.setAttribute('data-style', s);
				} catch(e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
